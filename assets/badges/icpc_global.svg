<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradICPC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <radialGradient id="goldAura" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueAura" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <!-- Card Border Gradient -->
    <linearGradient id="borderGradICPC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="340" rx="16" fill="url(#bgGradICPC)"/>
  <rect width="600" height="340" rx="16" fill="url(#goldAura)"/>
  <rect width="600" height="340" rx="16" fill="url(#blueAura)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="597" height="337" rx="15" fill="none" stroke="url(#borderGradICPC)" stroke-width="2"/>

  <!-- Geometric Grid Accent -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="340"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="250" y1="0" x2="250" y2="340"/>
    <line x1="350" y1="0" x2="350" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
    <line x1="550" y1="0" x2="550" y2="340"/>
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="170" x2="600" y2="170"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
  </g>

  <!-- ICPC Stylized Globe / Bracket Insignia -->
  <g transform="translate(48, 40)">
    <!-- Stylized Globe / Emblem -->
    <circle cx="28" cy="28" r="26" fill="#0B132B" stroke="#F59E0B" stroke-width="2"/>
    <!-- Latitude / Longitude arcs -->
    <ellipse cx="28" cy="28" rx="13" ry="25" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.8"/>
    <line x1="3" y1="28" x2="53" y2="28" stroke="#10B981" stroke-width="1.5" opacity="0.8"/>
    <!-- Code Brackets around Globe -->
    <path d="M 12 20 L 4 28 L 12 36" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 44 20 L 52 28 L 44 36" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Headers -->
  <text x="120" y="62" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="1">ICPC GLOBAL REGISTRY</text>
  <text x="120" y="84" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#F59E0B" letter-spacing="1.5">INTERNATIONAL COLLEGIATE PROGRAMMING CONTEST</text>

  <!-- Verified Badge Pill -->
  <g transform="translate(430, 48)">
    <rect width="122" height="30" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="18" cy="15" r="5" fill="#F59E0B"/>
    <text x="32" y="19" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Inner Information Frame -->
  <g transform="translate(48, 118)">
    <rect width="504" height="162" rx="12" fill="#0A0F1D" fill-opacity="0.8" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Left Column: Contestant Details -->
    <text x="24" y="32" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">OFFICIAL CONTESTANT</text>
    <text x="24" y="58" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">Mô Ha Mách Bu Ba Ka</text>
    <text x="24" y="78" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Alias / Handle: Ka Nguyen</text>

    <!-- Institution -->
    <text x="24" y="112" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">INSTITUTION</text>
    <text x="24" y="134" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">PTIT - Posts &amp; Telecoms Institute of Technology</text>

    <!-- Divider -->
    <line x1="315" y1="20" x2="315" y2="142" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Right Column: ICPC Global ID -->
    <text x="335" y="32" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">GLOBAL ID (ICPC ID)</text>
    <g transform="translate(335, 46)">
      <rect width="145" height="36" rx="8" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="800" fill="#F59E0B">KX82OXXF5CSE</text>
    </g>

    <text x="335" y="112" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">REGION / DIVISION</text>
    <text x="335" y="134" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#10B981">Asia Pacific / Vietnam</text>
  </g>

  <!-- Footer Link -->
  <text x="50" y="312" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569">
    Official Registry: <tspan fill="#64748B">icpc.global/ICPCID/KX82OXXF5CSE</tspan>
  </text>
  <text x="550" y="312" text-anchor="end" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#F59E0B">
    HCMPTIT ICPC Team
  </text>
</svg>
