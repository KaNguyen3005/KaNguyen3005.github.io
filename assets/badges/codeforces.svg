<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03A89E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#03A89E"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#03A89E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#03A89E" stop-opacity="0"/>
    </radialGradient>
    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03A89E" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#03A89E" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="600" height="340" rx="16" fill="url(#cardGlow)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="597" height="337" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="340"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="280" y1="0" x2="280" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="440" y1="0" x2="440" y2="340"/>
    <line x1="520" y1="0" x2="520" y2="340"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>

  <!-- Decorative Rating Chart Curve (Sparkline) -->
  <path d="M 50 250 Q 120 230, 180 235 T 280 200 T 380 180 T 480 160 T 550 140" 
        fill="none" stroke="#03A89E" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M 50 250 Q 120 230, 180 235 T 280 200 T 380 180 T 480 160 T 550 140 L 550 270 L 50 270 Z" 
        fill="url(#cyanGlow)" opacity="0.2"/>

  <!-- Codeforces Iconic 3 Bars Logo -->
  <g transform="translate(48, 42)">
    <!-- Yellow Bar (Left, Medium) -->
    <rect x="0" y="20" width="12" height="42" rx="3" fill="#FFC107"/>
    <!-- Blue Bar (Center, Tall) -->
    <rect x="18" y="0" width="12" height="62" rx="3" fill="#2196F3"/>
    <!-- Red Bar (Right, Short) -->
    <rect x="36" y="32" width="12" height="30" rx="3" fill="#F44336"/>
  </g>

  <!-- Brand Title -->
  <text x="120" y="68" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="1">CODEFORCES</text>
  <text x="120" y="92" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2">COMPETITIVE PROGRAMMING</text>

  <!-- Verified Status Pill -->
  <g transform="translate(420, 52)">
    <rect width="132" height="30" rx="15" fill="#03A89E" fill-opacity="0.15" stroke="#03A89E" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="20" cy="15" r="5" fill="#03A89E"/>
    <text x="34" y="19" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Center Card Content -->
  <!-- Handle Badge Box -->
  <g transform="translate(48, 130)">
    <rect width="504" height="152" rx="12" fill="#0B132B" fill-opacity="0.75" stroke="#1E293B" stroke-width="1"/>
    
    <!-- User Handle & Tier -->
    <text x="28" y="44" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1">HANDLE</text>
    <text x="28" y="76" font-family="'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="800" fill="#03A89E">morex3</text>
    
    <!-- Rank Pill -->
    <g transform="translate(28, 96)">
      <rect width="116" height="26" rx="13" fill="#03A89E" fill-opacity="0.2" stroke="#03A89E" stroke-width="1"/>
      <text x="58" y="17" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#00E5FF">Specialist</text>
    </g>

    <!-- Divider -->
    <line x1="220" y1="24" x2="220" y2="128" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Metrics Column -->
    <text x="250" y="44" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1">RATING</text>
    <text x="250" y="78" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="30" font-weight="900" fill="#38BDF8">1400+</text>
    <text x="250" y="112" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Top Tier Competitive Division</text>

    <!-- ICPC / Algorithm badge mini icon -->
    <g transform="translate(440, 40)">
      <circle cx="28" cy="38" r="26" fill="#03A89E" fill-opacity="0.1" stroke="#03A89E" stroke-opacity="0.3" stroke-width="1"/>
      <path d="M 20 38 L 26 44 L 38 30" fill="none" stroke="#03A89E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Footer Info -->
  <text x="50" y="312" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569">
    Platform: <tspan fill="#64748B">codeforces.com/profile/morex3</tspan>
  </text>
  <text x="550" y="312" text-anchor="end" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#03A89E">
    PTITHCM Algorithm Team
  </text>
</svg>
