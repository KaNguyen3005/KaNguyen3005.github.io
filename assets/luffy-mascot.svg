<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="straw" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>
    <linearGradient id="redRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="46" fill="#141E33" stroke="#F59E0B" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Straw Hat Crown Top -->
  <ellipse cx="50" cy="42" rx="24" ry="18" fill="url(#straw)"/>
  
  <!-- Red Ribbon -->
  <path d="M 27 46 Q 50 51 73 46 Q 74 50 72 52 Q 50 57 28 52 Z" fill="url(#redRibbon)"/>
  
  <!-- Straw Hat Wide Brim -->
  <ellipse cx="50" cy="54" rx="42" ry="14" fill="url(#straw)"/>
  
  <!-- Hat Brim Texture & Seam Lines -->
  <path d="M 12 54 Q 50 64 88 54" stroke="#B45309" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 20 50 Q 50 60 80 50" stroke="#B45309" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Luffy Jolly Roger Smiling Skull Face -->
  <circle cx="50" cy="67" r="10" fill="#FFFFFF"/>
  <circle cx="46" cy="65" r="2.2" fill="#0F172A"/>
  <circle cx="54" cy="65" r="2.2" fill="#0F172A"/>
  <path d="M 45 70 Q 50 75 55 70" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
